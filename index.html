<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" id="meta-desc" content="تسوق بسهولة من متجرك المفضل">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" id="apple-title" content="كافي أونلاين">
  <meta name="theme-color" id="theme-color-meta" content="#6366F1">

  <link rel="apple-touch-icon" id="apple-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" id="favicon-link" href="favicon.png"/>

  <title id="page-title">كافي أونلاين</title>
  <link rel="manifest" id="manifest-placeholder" href="manifest.json">

  <!-- Open Graph / Facebook / WhatsApp Preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" id="og-title" content="كافي أونلاين">
  <meta property="og:description" id="og-desc" content="تسوق بسهولة واطلب الآن">
  <meta property="og:image" id="og-image" content="icons/Icon-512.png">

  <script>
    (async function() {
      try {
        const pathSegments = window.location.pathname.replace(/^\//, '').split('/');
        const slug = pathSegments[0];
        if (!slug || slug === 'index.html') return;

        const SUPABASE_URL = 'https://kmkthmaztyhhvxkousmd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BcEbJczP_CqFlwUwqQrPXA_JjywBSV5';

        // 1. Point manifest immediately to the dynamic Vercel endpoint
        const manifestLink = document.getElementById('manifest-placeholder');
        if (manifestLink) {
          manifestLink.setAttribute('href', '/api/manifest?slug=' + encodeURIComponent(slug));
        }

        // 2. Query store details from Supabase
        const queryUrl = SUPABASE_URL + '/rest/v1/online_store_settings?slug=eq.' + encodeURIComponent(slug) + '&select=store_name,logo_url,slug,primary_color,description&limit=1';
        const res = await fetch(queryUrl, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY,
          }
        });

        if (!res.ok) return;
        const data = await res.json();
        if (!data || data.length === 0) return;

        const store = data[0];
        const storeName = store.store_name || 'كافي أونلاين';
        const logoUrl = store.logo_url || null;
        const primaryColor = store.primary_color || '#6366F1';
        const desc = store.description || ('تسوق مباشرة من متجر ' + storeName);
        const storeSlug = store.slug || slug;
        const startUrl = '/' + storeSlug;

        // Update Page Title
        document.title = storeName;
        const pageTitle = document.getElementById('page-title');
        if (pageTitle) pageTitle.textContent = storeName;

        // Update Apple PWA meta
        const appleTitle = document.getElementById('apple-title');
        if (appleTitle) appleTitle.setAttribute('content', storeName);

        const themeMeta = document.getElementById('theme-color-meta');
        if (themeMeta && primaryColor) themeMeta.setAttribute('content', primaryColor);

        const metaDesc = document.getElementById('meta-desc');
        if (metaDesc) metaDesc.setAttribute('content', desc);

        // Update Favicon and Apple Touch Icon
        if (logoUrl) {
          const appleIcon = document.getElementById('apple-icon');
          if (appleIcon) appleIcon.setAttribute('href', logoUrl);

          const favicon = document.getElementById('favicon-link');
          if (favicon) {
            favicon.setAttribute('href', logoUrl);
          }

          const ogImage = document.getElementById('og-image');
          if (ogImage) ogImage.setAttribute('content', logoUrl);
        }

        const ogTitle = document.getElementById('og-title');
        if (ogTitle) ogTitle.setAttribute('content', storeName);

        const ogDesc = document.getElementById('og-desc');
        if (ogDesc) ogDesc.setAttribute('content', desc);

        // Client-side dynamic manifest fallback (via Blob / Data URL)
        const icons = logoUrl
          ? [
              { src: logoUrl, sizes: '192x192', type: 'image/png' },
              { src: logoUrl, sizes: '512x512', type: 'image/png' },
              { src: logoUrl, sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: logoUrl, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ]
          : [
              { src: 'icons/Icon-192.png', sizes: '192x192', type: 'image/png' },
              { src: 'icons/Icon-512.png', sizes: '512x512', type: 'image/png' }
            ];

        const manifestObj = {
          name: storeName,
          short_name: storeName,
          start_url: startUrl,
          scope: startUrl,
          display: 'standalone',
          background_color: '#ffffff',
          theme_color: primaryColor,
          description: desc,
          orientation: 'portrait-primary',
          prefer_related_applications: false,
          lang: 'ar',
          dir: 'rtl',
          icons: icons
        };

        try {
          const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
          const manifestUrl = URL.createObjectURL(blob);
          if (manifestLink && !manifestLink.getAttribute('href').startsWith('/api/')) {
            manifestLink.setAttribute('href', manifestUrl);
          }
        } catch (_) {}
      } catch (e) {
        console.warn('[PWA Manifest] Could not load dynamic manifest:', e);
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
